name: Release
# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          # one app for both Apple silicon and Intel Macs
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    env:
      # whether the signing certificates are set up (secrets can't be tested in a step's if)
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install
      # Self-updating desktop app: needs the update signing key (see "Releasing" in the README). Without
      # it the installers are built as before and the app points people to the release page instead.
      - name: Turn on the updater
        if: vars.TAURI_UPDATER_PUBKEY != ''
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: bun scripts/updater-config.ts
      # Code signing, so Windows and macOS don't warn about an unknown publisher: needs certificates
      # (see "Releasing" in the README). Without them the installers are built unsigned, as before.
      - name: Windows code signing
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $env:WINDOWS_CERTIFICATE_THUMBPRINT = $cert.Thumbprint
          bun scripts/windows-signing.ts
      - name: macOS code signing and notarising
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # the bundler signs and notarises when these are in its environment
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            delim="EOF_$RANDOM$RANDOM"
            { echo "$v<<$delim"; printenv "$v"; echo "$delim"; } >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Railplot ${{ github.ref_name }}
          releaseBody: See the README for what's new. Windows users want the -setup.exe, Mac users the .dmg; the .html file runs in any browser without installing. The railplot-claude-*.mcpb files add the Railplot connector to the Claude desktop app.
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Attach offline HTML
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/index.html railplot-offline.html
          gh release upload "${{ github.ref_name }}" railplot-offline.html --clobber

  hub:
    # The Railplot hub as single-file programs for Windows, Linux, Raspberry Pi (64-bit) and Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun scripts/build-hub.ts --all
      - name: Check the Claude connector bundles
        continue-on-error: true
        run: |
          for f in dist/hub/*.mcpb; do
            d=$(mktemp -d); unzip -q "$f" manifest.json -d "$d"
            npx -y @anthropic-ai/mcpb validate "$d/manifest.json"
          done
      - name: Attach the hub programs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # wait for the draft release made by the build job
          for i in $(seq 1 30); do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "${{ github.ref_name }}" dist/hub/* --clobber
