[package]
name = "railplot"
version = "0.14.0"
description = "Free, open-source track planner for OO and H0 model railways"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "railplot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
